# The browser's only entry point: the single-page app plus a reverse proxy to mission-control, so
# everything is one origin (no CORS). rover-sim and the HMAC link endpoints are not reachable here.

upstream mission_control {
    server mission-control:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Security headers on every response, including the proxied API.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # Inline SVG favicon (data:), photos and terrain maps as blob: URLs, WebGL shaders need no eval.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Content-hashed bundles never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The app shell must always be revalidated, or browsers keep old bundle names.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        try_files $uri /index.html;
    }

    # Server-sent events: no buffering (each event must reach the browser at once), a long read
    # timeout (the server sends a heartbeat every 15 s), HTTP/1.1 without "Connection: close".
    location ~ ^/api/v1/rovers/[0-9]+/events$ {
        proxy_pass http://mission_control;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ~ ^/(api/|v3/api-docs|swagger-ui) {
        proxy_pass http://mission_control;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Requests are small JSON; photos come back, none go up.
        client_max_body_size 1m;
    }
}
